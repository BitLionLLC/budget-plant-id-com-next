<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#fff}
iframe{position:absolute;left:0;border:0}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const off = +(q.get('off')||0), w = +(q.get('w')||1440), h = +(q.get('h')||9400);
const dark = q.get('dark') === '1';
const f = document.getElementById('f');
f.style.width = w+'px'; f.style.height = h+'px'; f.style.top = (-off)+'px';
f.src = q.get('path') || '/';
f.addEventListener('load', () => {
  if (dark) f.contentDocument.documentElement.classList.add('dark');
  else f.contentDocument.documentElement.classList.remove('dark');
});
</script>
